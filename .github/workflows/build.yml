name: build
permissions:
  contents: write
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup python (asset validator)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install validator deps
        run: pip install pillow
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build (includes validateAssets via check, plus the vanilla resource pack zip)
        run: ./gradlew build zipVanillaResourcePack --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DragonBrain-3.0
          path: build/libs/

  server-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: prepare dev server (eula + rcon)
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          enable-rcon=true
          rcon.password=dragonbrain-smoke
          rcon.port=25575
          online-mode=false
          level-type=minecraft:superflat
          spawn-protection=0
          max-tick-time=0
          PROPS
      - name: boot server and run RCON smoke test
        run: |
          set +e
          # seed both candidate run dirs (loom default is run/)
          for d in run run/server; do
            mkdir -p $d
            echo "eula=true" > $d/eula.txt
            cp run/server.properties $d/server.properties 2>/dev/null || true
          done
          ./gradlew runServer --console=plain --args="--nogui" > server.log 2>&1 &
          SERVER_PID=$!
          ( for i in $(seq 1 48); do
              sleep 15
              grep -hE "Done \(|RCON running|Starting minecraft server|EULA|FAILED|Exception in|ERROR" server.log 2>/dev/null | tail -1 > .bootline
              if ! cmp -s .bootline .bootline.prev 2>/dev/null; then cp .bootline .bootline.prev; while IFS= read -r l; do echo "::notice::BOOT $l"; done < .bootline; fi
            done ) &
          WATCH_PID=$!
          timeout 660 python3 -u tools/ci_server_smoke.py dragonbrain-smoke 25575 600 > smoke.log 2>&1
          SMOKE=$?
          kill $WATCH_PID 2>/dev/null
          timeout 45 tail --pid=$SERVER_PID -f /dev/null || kill $SERVER_PID 2>/dev/null
          wait $SERVER_PID 2>/dev/null
          echo "smoke_exit=$SMOKE"
          echo "----- smoke transcript -----"; cat smoke.log
          echo "----- server log tail -----"; tail -40 server.log
          echo "----- where did the server run? -----"; find . -maxdepth 3 -name "eula.txt" -o -maxdepth 3 -name "server.properties" | head
          head -40 smoke.log | while IFS= read -r line; do echo "::notice::SMOKE $line"; done
          grep -iE "error|exception|caused by" server.log | grep -viE "rcon" | head -10 | while IFS= read -r line; do echo "::error::SERVER $line"; done
          exit $SMOKE
      - name: publish logs to ci-logs branch
        if: always()
        run: |
          git config user.name "dragonbrain-ci"
          git config user.email "ci@dragonbrain.invalid"
          mkdir -p /tmp/ci-logs
          cp smoke.log server.log /tmp/ci-logs/ 2>/dev/null || true
          find run -path "*crash-reports*" -name "*.txt" 2>/dev/null | head -3 | while read -r f; do cp "$f" /tmp/ci-logs/; done
          git checkout --orphan ci-logs-tmp
          git rm -rf --quiet . 2>/dev/null || true
          mkdir -p logs && cp /tmp/ci-logs/* logs/ 2>/dev/null || true
          git add logs
          git commit -q -m "smoke logs run ${{ github.run_id }}" || exit 0
          git push -f origin ci-logs-tmp:ci-logs
      - name: upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-smoke-log
          path: server.log

  client-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual display + GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libasound2t64 > /dev/null
      - name: boot dev client headlessly and scan for resource errors
        run: |
          set +e
          chmod +x ./gradlew
          timeout 540 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain > client.log 2>&1 &
          CLIENT_PID=$!
          BOOTED=0
          for i in $(seq 1 40); do
            sleep 12
            if grep -qE "Created: [0-9]+x[0-9]+x[0-9]+ minecraft:textures/atlas/blocks|Sound engine started" client.log 2>/dev/null; then BOOTED=1; sleep 20; break; fi
            kill -0 $CLIENT_PID 2>/dev/null || break
          done
          echo "booted=$BOOTED"
          grep -inE "dragonbrain" client.log | grep -iE "error|missing|fail|exception" | grep -viE "recommends" | head -30 > client-errors.txt || true
          grep -inE "Unable to load model|Missing texture|Failed to load (model|blockstate)|Mixin.*(ERROR|FATAL)" client.log | head -30 >> client-errors.txt || true
          pkill -f "Minecraft" 2>/dev/null; kill $CLIENT_PID 2>/dev/null; wait $CLIENT_PID 2>/dev/null
          echo "----- dragonbrain-relevant client errors -----"; cat client-errors.txt
          echo "----- client log tail -----"; tail -30 client.log
          if [ "$BOOTED" != "1" ]; then echo "::error::client never reached resource loading"; exit 2; fi
          if [ -s client-errors.txt ]; then echo "::error::client resource errors found"; exit 1; fi
          echo "CLIENT SMOKE PASSED"
      - name: publish client log to ci-logs branch
        if: always()
        run: |
          git config user.name "dragonbrain-ci"
          git config user.email "ci@dragonbrain.invalid"
          git fetch origin ci-logs || true
          git checkout -B ci-logs-tmp origin/ci-logs 2>/dev/null || git checkout --orphan ci-logs-tmp
          mkdir -p logs
          cp client.log logs/client.log 2>/dev/null || true
          git add logs/client.log 2>/dev/null || true
          git commit -q -m "client log run ${{ github.run_id }}" || exit 0
          git push -f origin ci-logs-tmp:ci-logs
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, server-smoke, client-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: DragonBrain-3.0
          path: dist
      - name: list artifacts
        run: ls -lh dist/
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v3.0.0 --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create v3.0.0 dist/dragonbrain-3.0.0.jar dist/DragonBrain-AbyssalEnd-Vanilla.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "DragonBrain 3.0.0 — End Visual Overhaul (pre-release)" \
            --notes "DragonBrain 3.0 visual overhaul for Minecraft Java 1.21.11 + Fabric (Loader 0.20.1+, Fabric API 0.141.6+).

          **Downloads:**
          - \`dragonbrain-3.0.0.jar\` — the mod (put in \`mods/\`)
          - \`DragonBrain-AbyssalEnd-Vanilla.zip\` — OPTIONAL vanilla-End texture refresh (put in \`resourcepacks/\`)

          Verified in CI: compile, dedicated-server smoke test (10/10 RCON assertions), headless-client resource load (0 errors). Pre-release from PR #1 branch; see README/CREDITS in the repo. All artwork original or preserved DragonBrain 2.0 assets — no third-party pack files bundled (Beyonder/Fancy End are separate optional downloads from their authors)."
