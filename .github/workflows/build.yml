name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup python (asset validator)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install validator deps
        run: pip install pillow
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build (includes validateAssets via check, plus the vanilla resource pack zip)
        run: ./gradlew build zipVanillaResourcePack --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DragonBrain-3.0
          path: build/libs/

  server-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: prepare dev server (eula + rcon)
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          enable-rcon=true
          rcon.password=dragonbrain-smoke
          rcon.port=25575
          online-mode=false
          level-type=minecraft:superflat
          spawn-protection=0
          max-tick-time=0
          PROPS
      - name: boot server and run RCON smoke test
        run: |
          set +e
          ./gradlew runServer --console=plain --args="--nogui" > server.log 2>&1 &
          SERVER_PID=$!
          python3 -u tools/ci_server_smoke.py dragonbrain-smoke 25575 900 > smoke.log 2>&1
          SMOKE=$?
          wait $SERVER_PID
          SERVER_EXIT=$?
          echo "smoke_exit=$SMOKE server_exit=$SERVER_EXIT"
          echo "----- smoke transcript -----"
          cat smoke.log
          echo "----- server log tail -----"
          tail -60 server.log
          # mirror key lines into annotations (readable via the GitHub API)
          head -40 smoke.log | while IFS= read -r line; do echo "::notice::SMOKE $line"; done
          grep -iE "error|exception|caused by|FATAL" server.log | grep -viE "rcon" | head -15 | while IFS= read -r line; do echo "::error::SERVER $line"; done
          exit $SMOKE
      - name: upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-smoke-log
          path: server.log
